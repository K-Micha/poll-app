<div class="app-header">
<app-header logoSrc="/app-icons/logo-purple.svg" [showButton]="false"></app-header>
</div>

<main class="create-survey">
  <div class="content-wrapper">
    <form class="create-survey__form">

      <header class="header">
        <span class="header__status">Draft</span>

        <div class="header__wrapper">
          <h1 class="header__title">Create new survey</h1>

          <button class="btn-cancel header__btn" type="button" tabindex="-1" (click)="cancelSurvey()">
            <span class="btn-cancel__text">Cancel</span>
            <span class="btn-cancel__icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <div class="create-survey__content">
        <section class="survey-details">
          <div class="survey-details__wrapper">
            <div class="survey-details__left">
              <div class="form-field">
                <label class="form-field__label" for="survey-name">Survey name</label>

                <div class="form-field__control">
                  <input class="input-inline form-field__input form-field__input--name" id="survey-name"
                    name="surveyName" type="text" [value]="surveyName" (input)="updateSurveyName($event)"
                    (keydown.enter)="$event.preventDefault()"
                    [class.input-inline--invalid]="showValidationErrors() && !surveyName.trim()">

                  <button class="btn-delete form-field__delete" type="button" tabindex="-1"
                    aria-label="Clear survey name" (click)="clearSurveyName()">
                    <span class="btn-delete__icon" aria-hidden="true"></span>
                  </button>
                </div>
              </div>

              <div class="survey-details__row">
                <div class="form-field">
                  <label class="form-field__label" for="survey-end-date">
                    Set end date
                    <span class="form-field__label--optional">(optional)</span>
                  </label>

                  <div class="form-field__wrapper form-field--end-date">
                    <input class="input-inline form-field__input form-field__input--end-date" id="survey-end-date"
                      name="surveyEndDate" type="text" inputmode="numeric" maxlength="10" autocomplete="off"
                      [value]="surveyEndDate" (input)="formatEndDate($event)" (keydown.enter)="completeEndDate($event)"
                      (blur)="validateEndDate($event)">

                    <button class="btn-delete form-field__delete" type="button" tabindex="-1"
                      aria-label="Clear end date" (click)="clearEndDate()">
                      <span class="btn-delete__icon" aria-hidden="true"></span>
                    </button>
                  </div>
                </div>

                <div class="survey-details__category">
                  <app-dropdown label="Choose category" [invalid]="showValidationErrors() && !selectedCategory"
                    (categoryChange)="updateCategory($event)">
                  </app-dropdown>
                </div>
              </div>
            </div>

            <div class="form-field form-field--description">
              <label class="form-field__label--top" for="survey-description">
                Describing text
                <span class="form-field__label--optional">(optional)</span>
              </label>

              <div class="form-field__control--flex-start">
                <textarea class="input-inline form-field__description" id="survey-description" name="surveyDescription"
                  [value]="surveyDescription" (input)="updateDescription($event)"></textarea>

                <button class="btn-delete form-field__delete padding-top" type="button" tabindex="-1" aria-label="Clear description"
                  (click)="clearDescription()">
                  <span class="btn-delete__icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="survey-questions" aria-labelledby="survey-questions-title">
          <div class="survey-questions__wrapper">

            @for (question of questions; track $index; let questionIndex = $index) {
            <article class="question">
              <div class="question__header">
                <label class="question__label" [for]="'question-' + (questionIndex + 1)">
                  {{ questionIndex + 1 }}. Question
                </label>

                <button class="btn-delete form-field__delete" type="button" tabindex="-1" [attr.aria-label]="questionIndex === 0
                              ? 'Clear question 1'
                              : 'Delete question ' + (questionIndex + 1)" (click)="deleteQuestion(questionIndex)">
                  <span class="btn-delete__icon" aria-hidden="true"></span>
                </button>
              </div>

              <input class="input-inline question__input" [id]="'question-' + (questionIndex + 1)"
                [name]="'question-' + (questionIndex + 1)" type="text" [value]="question.text" [placeholder]="questionIndex === 0
                      ? 'Which date would work best for you?'
                      : ''" (input)="updateQuestion(questionIndex, $event)" (keydown.enter)="$event.preventDefault()"
                [class.input-inline--invalid]="
                         showValidationErrors() && !question.text.trim()">

              <div class="question__answers-header">
                <span class="form-field__label">Answers</span>

                <label class="checkbox">
                  <input class="checkbox__input" [name]="'multipleAnswers-' + (questionIndex + 1)" type="checkbox"
                    [checked]="question.multipleAnswers" (change)="updateMultipleAnswers(questionIndex, $event)">

                  <span class="checkbox__label">Allow multiple answers.</span>
                </label>
              </div>

              <div class="question__answers">
                @for (answer of question.answers; track $index; let answerIndex = $index) {
                <div class="answer">
                  <label class="answer__label" [for]="'answer-' + (questionIndex + 1) + '-' + (answerIndex + 1)">
                    {{ getAnswerLetter(answerIndex) }}.
                  </label>

                  <input class="input-inline answer__input"
                    [id]="'answer-' + (questionIndex + 1) + '-' + (answerIndex + 1)"
                    [name]="'answer-' + (questionIndex + 1) + '-' + (answerIndex + 1)" type="text" [value]="answer.text"
                    (input)="updateAnswer(questionIndex, answerIndex, $event)" (keydown.enter)="$event.preventDefault()"
                    [class.input-inline--invalid]="showValidationErrors() && !answer.text.trim()">

                  <button class="btn-delete form-field__delete" type="button" tabindex="-1"
                    [attr.aria-label]="'Delete answer ' + getAnswerLetter(answerIndex)"
                    (click)="deleteAnswer(questionIndex, answerIndex)">
                    <span class="btn-delete__icon" aria-hidden="true"></span>
                  </button>
                </div>
                }

                <div class="add-wrapper">
                  <button class="add-btn question__add-answer" type="button" tabindex="-1"
                    (click)="addAnswer(questionIndex)">
                    <span class="add-btn__content">
                      <span class="add-btn__text">Add answer</span>
                      <img class="add-btn__icon" src="/app-icons/circle.svg" alt="" aria-hidden="true">
                    </span>

                    <span class="add-btn__line" aria-hidden="true"></span>
                  </button>
                </div>
              </div>
            </article>
            }

            <div class="question question--add">
              <button class="question-btn survey-questions__add" type="button" tabindex="-1" (click)="addQuestion()">
                <span class="question-btn__text">Add next question</span>
                <img class="question-btn__icon" src="/app-icons/circle.svg" alt="" aria-hidden="true">
              </button>
            </div>

          </div>
        </section>
      </div>

      <footer class="footer">
        <div class="footer__wrapper">
          <button class="btn btn--primary footer__btn" type="button"
            [class.footer__btn--active]="isPublishOverlayOpen()" (click)="publishSurvey()">
            <span class="btn__text">Publish</span>
            <img class="btn__icon" src="/app-icons/check.svg" alt="" aria-hidden="true">
          </button>

          @if (isPublishOverlayOpen()) {
          <div class="overlay-filter" aria-hidden="true"></div>
          <div class="overlay-blocker" aria-hidden="true" (click)="highlightCloseButton()"></div>

          <div class="overlay">
            <span class="overlay__text">Your survey is now published</span>

            <button class="overlay__close" type="button" aria-label="Close notification"
              [class.overlay__close--highlight]="isCloseHighlighted()" (animationend)="resetCloseHighlight()"
              (click)="closePublishOverlay()">
              <span class="overlay__close-icon" aria-hidden="true"></span>
            </button>
          </div>
          }
        </div>
      </footer>
    </form>
  </div>

</main>
