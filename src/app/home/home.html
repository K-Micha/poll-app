<app-header logoSrc="/icons/logo-orange.svg" [showButton]="false"></app-header>

<main class="home">
  <div class="content-wrapper home__wrapper">
    <section class="home__hero">
      <div class="home__hero-content">
        <h1 class="home__title">
          Collect Feedback,<br>
          Unlock Ideas
        </h1>

        <div class="home__description-wrapper">
          <p class="home__description">
            Create and share surveys in minutes – from team events to workplace
            culture. Collect opinions, engage your audience, and turn feedback
            into action.
          </p>
        </div>

        <div class="home__create-button" type="button">
          <app-new-survey variant="home" />
        </div>
      </div>

      <div class="home__hero-image-wrapper">
        <img class="home__hero-image" src="/img/animation1.svg" alt="Illustration of a digital survey">
      </div>
    </section>

    <section class="surveys" aria-labelledby="surveys-title">
      <div class="surveys__title-wrapper">
        <h2 class="surveys__title" id="surveys-title">
          Your surveys
        </h2>

        <p class="surveys__subtitle">
          Ending soon surveys
        </p>
      </div>
    </section>
    <app-survey-card></app-survey-card>
  </div>
</main>
